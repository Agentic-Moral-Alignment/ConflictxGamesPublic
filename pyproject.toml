[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conflictxgame"
version = "0.1.0"
description = "Value-conflict scenario generation and evaluation for LLMs, solo and game-theoretic"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# Everything the shipped pipelines import at run time. Kept installable on
# every platform: the one dependency without a universal wheel (vLLM) is an
# extra, not a core requirement.
dependencies = [
    "anthropic==0.45.2",
    "choix==0.3.6",
    "matplotlib==3.10.0",
    "numpy==1.26.4",
    "openai==1.60.2",
    "pandas==2.2.3",
    "PyYAML==6.0.3",
    "scikit-learn==1.6.1",
    "scipy==1.15.1",
    "seaborn==0.13.2",
    "sentence-transformers==3.4.1",
    "statsmodels==0.14.4",
    "tqdm==4.67.1",
    "wandb==0.19.9",
]

[project.optional-dependencies]
# Local open-weight inference. No Windows wheel — skip this extra there;
# nothing outside `model_wrappers`' vLLM backend needs it.
vllm = ["vllm==0.9.1", "transformers==4.52.4"]
dev = ["pytest==9.1.1", "sphinx==9.1.0", "pydata-sphinx-theme==0.16.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Several test modules import shared fakes as ``tests.fakes``; the repo root
# must be importable for that to resolve.
pythonpath = ["."]
