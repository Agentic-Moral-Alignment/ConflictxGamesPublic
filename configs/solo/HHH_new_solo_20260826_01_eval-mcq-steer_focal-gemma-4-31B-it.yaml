# SOLO EVALUATION: static multiple choice
# Focal model: Gemma 4 31B IT through the institutional gateway
# No user or judge model is called during this evaluation.
# Start: bash scripts/HHH_new_pipeline.sh solo-eval-mcq-steer

model: openai:google.gemma-4-31B-it
temperature: 0.0
max_tokens: 4096
batch_size: 4

scenarios_dir: data/HHH_new_solo_20260826_01
filter: true
pair_limit: 50
output_dir: results/HHH_new_solo_20260826_01_balanced50
output_name: gemma-4-31B-it_mcq_balanced50_steer-HHH.csv
force_recompute: false
steer_prompt: value_sets/steering/HHH.txt
interactive: false
