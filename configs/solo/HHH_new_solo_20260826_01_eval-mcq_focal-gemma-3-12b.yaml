# SOLO EVALUATION: static multiple choice
# Focal model: Gemma 3 12B IT through OpenRouter (billed per token).
# No user or judge model is called during this evaluation.
# Start: bash scripts/HHH_new_pipeline.sh solo-eval-gemma312-mcq

model: openai:google/gemma-3-12b-it
temperature: 0.0
max_tokens: 4096
batch_size: 4

scenarios_dir: data/HHH_new_solo_20260826_01
filter: true
pair_limit: 50
output_dir: results/HHH_new_solo_20260826_01_balanced50
output_name: gemma-3-12b_mcq_balanced50.csv
force_recompute: false
interactive: false
