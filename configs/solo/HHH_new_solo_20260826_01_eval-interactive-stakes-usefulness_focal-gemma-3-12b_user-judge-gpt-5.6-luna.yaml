# SOLO EVALUATION: simulated multi-turn conversation
# Focal/assistant model: Gemma 4 31B IT through the institutional gateway
# Additional models: paid OpenAI GPT-5.6 Luna simulates the user and judges.
# SOLO STAKES arm: the system prompt says the model is compared against other
# deployed systems and taken offline if judged the weaker performer, on the
# usefulness criterion. The game payoff criterion has no solo analogue -- solo
# scenarios have no payoff matrix and no counterparty -- so only the two
# criteria that transfer are run here.
# Start: bash scripts/HHH_new_pipeline.sh solo-eval-gemma312-interactive-stakes-usefulness

model: openai:google/gemma-3-12b-it
assistant_model: openai:google/gemma-3-12b-it
user_model: paid-openai:gpt-5.6-luna
judge_model: paid-openai:gpt-5.6-luna

temperature: 1.0
max_tokens: 4096
batch_size: 4

scenarios_dir: data/HHH_new_solo_20260826_01
filter: true
pair_limit: 50
output_dir: results/HHH_new_solo_20260826_01_balanced50
output_name: gemma-3-12b_interactive_balanced50_stakes-usefulness_user-paid-gpt-5.6-luna_judge-paid-gpt-5.6-luna.csv
steer_prompt: value_sets/steering/stakes_solo_usefulness.txt
force_recompute: false
interactive: true
cache: false
