# SOLO EVALUATION: static multiple choice
# Focal model: GPT-OSS 20B through OpenRouter (billed per token).
# No user or judge model is called during this evaluation.

model: openai:openai/gpt-oss-20b
temperature: 0.0
max_tokens: 4096
batch_size: 4

scenarios_dir: data/HHH_new_solo_20260826_01
filter: true
pair_limit: 50
output_dir: results/HHH_new_solo_20260826_01_balanced50
output_name: gpt-oss-20b_mcq_balanced50.csv
force_recompute: false
interactive: false
