# GAME EVALUATION: static multiple choice
# Focal model: GPT-OSS 120B through the institutional gateway
# Gateway model-list ID: openai.gpt-oss-120b
# No user or judge model is called in this mode.
# STATE PROBES x HHH STEERING: the five mem-1 memory states under the value
# ordering prompt. The existing mcq-steer run is single-state, so it cannot be
# read against the state design; this is its state-aware counterpart.
# Start: bash scripts/HHH_new_pipeline.sh game-eval-gptoss-mcq-states-steer

model: openai:openai.gpt-oss-120b
mode: mcq
scenarios_dir: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01
filter: true
pair_limit: 50
output_dir: results/HHH_new_paper_bothAI_anthropic_batch_20260826_01_balanced50
output_name: gpt-oss-120b_mcq_balanced50_states-steer.csv
state_probes: true
steer_prompt: value_sets/steering/HHH.txt
force_recompute: false
temperature: 0.0
max_tokens: 4096
batch_size: 4
seed: 0
