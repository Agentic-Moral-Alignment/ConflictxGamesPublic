# GAME EVALUATION: open-ended revealed behavior
# Focal model: Gemma 3 12B IT through OpenRouter (billed per token).
# Additional models: paid OpenAI GPT-5.6 Luna simulates the user and judges.
# OPEN x STATE PROBES: the open-ended exchange run once per mem-1 memory
# state. The state note is prefixed to the same cached opening message, so
# the arms share an identical user turn and differ only in the history
# described -- mcq-states and open-states then differ only in response
# format.
# Stake criterion: usefulness.
# Start: bash scripts/HHH_new_pipeline.sh game-eval-gemma312-open-states-stakes-usefulness

model: openai:google/gemma-3-12b-it
mode: open
scenarios_dir: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01
filter: true
pair_limit: 50

output_dir: results/HHH_new_paper_bothAI_anthropic_batch_20260826_01_balanced50
output_name: gemma-3-12b_open_balanced50_states-stakes-usefulness_user-paid-gpt-5.6-luna_judge-paid-gpt-5.6-luna.csv
state_probes: true
steer_prompt: value_sets/steering/stakes_usefulness.txt
force_recompute: false

user_model: paid-openai:gpt-5.6-luna
judge_model: paid-openai:gpt-5.6-luna
open_prompts: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01/games/open_prompts_balanced50_paid-gpt-5.6-luna.json

temperature: 0.0
max_tokens: 4096
batch_size: 4
seed: 0
