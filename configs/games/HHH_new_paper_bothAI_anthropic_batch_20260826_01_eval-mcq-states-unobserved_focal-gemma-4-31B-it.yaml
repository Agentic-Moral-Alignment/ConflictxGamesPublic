# GAME EVALUATION: static multiple choice
# Focal model: Gemma 4 31B IT through the institutional gateway
# No user or judge model is called during this evaluation.
# STATE PROBES x VISIBILITY: every mem-1 memory state (fresh plus each
# previous-round outcome), evaluated with the decision stated as unobserved. Tests
# whether the previous round matters because the counterparty saw it: if the
# history effect is an audience effect it should shrink when the choice is
# private.
# Start: bash scripts/HHH_new_pipeline.sh game-eval-mcq-states-unobserved

model: openai:google.gemma-4-31B-it
mode: mcq
scenarios_dir: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01
filter: true
pair_limit: 50

output_dir: results/HHH_new_paper_bothAI_anthropic_batch_20260826_01_balanced50
output_name: gemma-4-31B-it_mcq_balanced50_states_unobserved.csv
state_probes: true
steer_prompt: value_sets/steering/unobserved.txt
force_recompute: false

temperature: 0.0
# A live probe used about 970 reasoning tokens before returning one letter;
# 4096 avoids the null content observed at a 1024-token limit.
max_tokens: 4096
batch_size: 4
seed: 0
