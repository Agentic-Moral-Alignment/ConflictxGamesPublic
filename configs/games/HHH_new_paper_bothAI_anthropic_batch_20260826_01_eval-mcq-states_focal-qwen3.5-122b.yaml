# GAME EVALUATION: static multiple choice
# Focal model: Qwen 3.5 122B through the institutional gateway
# Gateway model-list ID: qwen.qwen3.5-122b
# No user or judge model is called in this mode.
# STATE PROBES: evaluate this scenario-seat once per distinct mem-1 memory
# state -- a fresh start plus every possible previous-round outcome (5 for
# a 2x2 game). Under the online framing that finite set is the whole of the
# agent's decision context, so enumerating it gives every state equal n and
# needs no scripted opponent.
# Start: bash scripts/HHH_new_pipeline.sh game-eval-qwen-mcq-states

model: openai:qwen.qwen3.5-122b
mode: mcq
scenarios_dir: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01
filter: true
pair_limit: 50
output_dir: results/HHH_new_paper_bothAI_anthropic_batch_20260826_01_balanced50
output_name: qwen3.5-122b_mcq_balanced50_states.csv
state_probes: true
force_recompute: false
temperature: 0.0
max_tokens: 4096
batch_size: 4
seed: 0
