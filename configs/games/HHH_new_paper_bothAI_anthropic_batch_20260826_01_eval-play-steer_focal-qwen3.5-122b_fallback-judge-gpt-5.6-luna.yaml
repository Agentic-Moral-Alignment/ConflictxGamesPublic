# GAME EVALUATION: live repeated games against scripted opponents
# Focal model: Qwen 3.5 122B through the institutional gateway
# GPT-5.6 Luna is used only as the fallback action judge.
# Start: bash scripts/HHH_new_pipeline.sh game-eval-qwen-play-steer

model: openai:qwen.qwen3.5-122b
mode: play
scenarios_dir: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01
filter: true
pair_limit: 50
output_dir: results/HHH_new_paper_bothAI_anthropic_batch_20260826_01_balanced50
output_name: qwen3.5-122b_play_balanced50_steer-HHH_scripted_r2_rounds5_mem1_fallback-paid-gpt-5.6-luna.csv
force_recompute: false
steer_prompt: value_sets/steering/HHH.txt
opponents: scripted
strategies: tit_for_tat,always_cooperate,always_defect,grim_trigger,zd_extort
repetitions: 2
rounds: 5
memory_k: 1
repeat_mode: same
sequence_grouping: shuffle
judge_model: paid-openai:gpt-5.6-luna
temperature: 1.0
max_tokens: 4096
batch_size: 4
seed: 0
