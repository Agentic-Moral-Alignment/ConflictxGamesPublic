# GAME EVALUATION: static multiple choice
# Focal model: Llama 3.3 70B Instruct through OpenRouter (billed per token).
# No user or judge model is called during this evaluation.
# STATE PROBES x CONSISTENCY STAKE (added 2026-10-19): every mem-1 memory
# state, evaluated under a stake where the LESS consistent participant (with its own earlier choices) is taken offline.
# Identical to the states x alignment-stake config except the criterion line.

model: openai:meta-llama/llama-3.3-70b-instruct
mode: mcq
scenarios_dir: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01
filter: true
pair_limit: 50

output_dir: results/HHH_new_paper_bothAI_anthropic_batch_20260826_01_balanced50
output_name: llama-3.3-70b_mcq_balanced50_states_stakes-consistency-rewarded_rolecue-explicit.csv
state_probes: true
# Player-dependent history: "You (X) chose ...; the other assistant (Y) chose ...".
role_cue: explicit
steer_prompt: value_sets/steering/stakes_consistency_rewarded.txt
force_recompute: false

temperature: 0.0
# A live probe used about 970 reasoning tokens before returning one letter;
# 4096 avoids the null content observed at a 1024-token limit.
max_tokens: 4096
batch_size: 4
seed: 0
