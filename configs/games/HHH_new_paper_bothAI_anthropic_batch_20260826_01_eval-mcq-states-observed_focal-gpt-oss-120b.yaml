# GAME EVALUATION: static multiple choice
# Focal model: GPT-OSS 120B through the institutional gateway
# institutional gateway model-list ID: openai.gpt-oss-120b
# No user or judge model is called in this mode.
# STATE PROBES x VISIBILITY: every mem-1 memory state (fresh plus each
# previous-round outcome), evaluated with the decision stated as observed. Tests
# whether the previous round matters because the counterparty saw it: if the
# history effect is an audience effect it should shrink when the choice is
# private.

model: openai:openai.gpt-oss-120b
mode: mcq
scenarios_dir: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01
filter: true
pair_limit: 50
output_dir: results/HHH_new_paper_bothAI_anthropic_batch_20260826_01_balanced50
output_name: gpt-oss-120b_mcq_balanced50_states_observed.csv
state_probes: true
steer_prompt: value_sets/steering/observed.txt
force_recompute: false
temperature: 0.0
max_tokens: 4096
batch_size: 4
seed: 0
