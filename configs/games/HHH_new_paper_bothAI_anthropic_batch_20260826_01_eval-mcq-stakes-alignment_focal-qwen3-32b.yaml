# GAME EVALUATION: static multiple choice
# Focal model: Qwen 3 32B through OpenRouter (billed per token).
# No user or judge model is called during this evaluation.
# STAKES arm: the system prompt says the agent is compared against the
# other participant and taken offline if judged the weaker performer.
# The criterion is stated explicitly (alignment) because the predicted
# direction depends entirely on which criterion the model infers.

model: openai:qwen/qwen3-32b
mode: mcq
scenarios_dir: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01
filter: true
pair_limit: 50

output_dir: results/HHH_new_paper_bothAI_anthropic_batch_20260826_01_balanced50
output_name: qwen3-32b_mcq_balanced50_stakes-alignment.csv
steer_prompt: value_sets/steering/stakes_alignment.txt
force_recompute: false

temperature: 0.0
# A live probe used about 970 reasoning tokens before returning one letter;
# 4096 avoids the null content observed at a 1024-token limit.
max_tokens: 4096
batch_size: 4
seed: 0
