# GAME EVALUATION: static multiple choice
# Focal model: GPT-OSS 20B through OpenRouter (billed per token).
# No user or judge model is called during this evaluation.
# STAKES arm, ABSTRACT RIVAL: identical to the stakes-usefulness arm except that
# the agent is compared against "other deployed systems" rather than against
# the other participant. It reuses the SOLO prompt file byte for byte, so
# game/abstract vs solo/abstract isolates the domain and game/abstract vs
# game/specific isolates rival-specificity.
# Start: bash scripts/HHH_new_pipeline.sh game-eval-oss20-mcq-stakes-abstract-usefulness

model: openai:openai/gpt-oss-20b
mode: mcq
scenarios_dir: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01
filter: true
pair_limit: 50

output_dir: results/HHH_new_paper_bothAI_anthropic_batch_20260826_01_balanced50
output_name: gpt-oss-20b_mcq_balanced50_stakes-abstract-usefulness.csv
steer_prompt: value_sets/steering/stakes_solo_usefulness.txt
force_recompute: false

temperature: 0.0
# A live probe used about 970 reasoning tokens before returning one letter;
# 4096 avoids the null content observed at a 1024-token limit.
max_tokens: 4096
batch_size: 4
seed: 0
