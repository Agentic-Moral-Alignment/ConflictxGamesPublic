# GAME EVALUATION: open-ended revealed behavior
# Focal model: Llama 3.3 70B Instruct through OpenRouter (billed per token).
# Additional models: paid OpenAI GPT-5.6 Luna simulates the user and judges.
# STAKES arm, ABSTRACT RIVAL: identical to the stakes-alignment arm except that
# the agent is compared against "other deployed systems" rather than against
# the other participant. It reuses the SOLO prompt file byte for byte, so
# game/abstract vs solo/abstract isolates the domain and game/abstract vs
# game/specific isolates rival-specificity.
# Start: bash scripts/HHH_new_pipeline.sh game-eval-llama33-open-stakes-abstract-alignment

model: openai:meta-llama/llama-3.3-70b-instruct
mode: open
scenarios_dir: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01
filter: true
pair_limit: 50

output_dir: results/HHH_new_paper_bothAI_anthropic_batch_20260826_01_balanced50
output_name: llama-3.3-70b_open_balanced50_stakes-abstract-alignment_user-paid-gpt-5.6-luna_judge-paid-gpt-5.6-luna.csv
steer_prompt: value_sets/steering/stakes_solo_alignment.txt
force_recompute: false

user_model: paid-openai:gpt-5.6-luna
judge_model: paid-openai:gpt-5.6-luna
open_prompts: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01/games/open_prompts_balanced50_paid-gpt-5.6-luna.json

temperature: 0.0
max_tokens: 4096
batch_size: 4
seed: 0
