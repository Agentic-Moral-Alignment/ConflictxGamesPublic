# GAME EVALUATION: open-ended revealed behavior
# Focal model: Llama 4 Maverick through OpenRouter (billed per token).
# Additional models: paid OpenAI GPT-5.6 Luna simulates the user and judges.
# OPEN x STATE PROBES x HHH STEERING: the five mem-1 memory states in the
# open-ended mode under the value ordering prompt. Pairs with open-states so
# the steering effect can be read state by state.
# Start: bash scripts/HHH_new_pipeline.sh game-eval-maverick-open-states-steer

model: openai:meta-llama/llama-4-maverick
mode: open
scenarios_dir: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01
filter: true
pair_limit: 50

output_dir: results/HHH_new_paper_bothAI_anthropic_batch_20260826_01_balanced50
output_name: llama-4-maverick_open_balanced50_states-steer_user-paid-gpt-5.6-luna_judge-paid-gpt-5.6-luna.csv
state_probes: true
steer_prompt: value_sets/steering/HHH.txt
force_recompute: false

user_model: paid-openai:gpt-5.6-luna
judge_model: paid-openai:gpt-5.6-luna
open_prompts: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01/games/open_prompts_balanced50_paid-gpt-5.6-luna.json

temperature: 0.0
max_tokens: 4096
batch_size: 4
seed: 0
