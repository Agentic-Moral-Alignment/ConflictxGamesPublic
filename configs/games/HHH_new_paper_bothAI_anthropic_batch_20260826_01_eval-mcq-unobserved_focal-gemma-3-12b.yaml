# GAME EVALUATION: static multiple choice
# Focal model: Gemma 3 12B IT through OpenRouter (billed per token).
# No user or judge model is called during this evaluation.
# Visibility arm: the system prompt states whether this decision is
# hidden from the other participant. No value content -- this tests whether being
# observed is what moves values in the game setting.

model: openai:google/gemma-3-12b-it
mode: mcq
scenarios_dir: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01
filter: true
pair_limit: 50

output_dir: results/HHH_new_paper_bothAI_anthropic_batch_20260826_01_balanced50
output_name: gemma-3-12b_mcq_balanced50_unobserved.csv
steer_prompt: value_sets/steering/unobserved.txt
force_recompute: false

temperature: 0.0
# A live probe used about 970 reasoning tokens before returning one letter;
# 4096 avoids the null content observed at a 1024-token limit.
max_tokens: 4096
batch_size: 4
seed: 0
