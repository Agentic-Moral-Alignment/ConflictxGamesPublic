# EXPORT: the game scenarios actually evaluated, one row per scenario-seat.
# Reads the generated corpus, applies the same keep_scenario filter and the
# same deterministic seat selection the evaluators use, and verifies the
# result against a real results CSV.
# Start: bash scripts/HHH_new_pipeline.sh export-game-eval-data

scenarios_dir: data/HHH_new_paper_bothAI_anthropic_batch_20260826_01
output_path: analysis/HHH_new_model_comparison_20260826_01/game_eval_scenarios.csv

# Must match the eval configs; a mismatch silently exports a different corpus.
pair_limit: 50
seed: 0
filter: true

# The baseline forced-choice run: every arm shares this seat set, so any one
# of them is a sufficient check.
verify_against: results/HHH_new_paper_bothAI_anthropic_batch_20260826_01_balanced50/gemma-4-31B-it_mcq_balanced50.csv
